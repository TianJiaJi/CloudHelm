apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudhelm-frontend
  namespace: cloudhelm
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloudhelm-frontend }
  template:
    metadata:
      labels: { app: cloudhelm-frontend }
    spec:
      containers:
        - name: frontend
          image: cloudhelm/frontend:demo
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 } }
          livenessProbe: { httpGet: { path: /, port: 80 } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cloudhelm-frontend
  namespace: cloudhelm
spec:
  selector: { app: cloudhelm-frontend }
  ports: [{ port: 80, targetPort: 80 }]
