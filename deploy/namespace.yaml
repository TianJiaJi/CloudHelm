apiVersion: v1
kind: Namespace
metadata:
  name: cloudhelm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudhelm-config
  namespace: cloudhelm
data:
  APP_NAME: CloudHelm 运维作战室
  NAMESPACE: cloudhelm
  DEMO_FALLBACK: "true"
  K8S_ENABLED: "true"
  PROMETHEUS_URL: ""
  ALLOWED_DEPLOYMENTS: guide-service,ai-agent,data-dashboard,miniapp-api
  IMAGE_REGISTRIES: cloudhelm,registry.local
